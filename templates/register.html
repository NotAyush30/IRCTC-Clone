{% extends "base.html" %}

{% block title %}Register{% endblock %}
{% block page_class %}center{% endblock %}

{% block content %}
<div class="box box-narrow">

    <h2>REGISTER</h2>

    <form method="POST" action="{{ url_for('register') }}">

        <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" name="username" placeholder="Enter your name" maxlength="50" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="50" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number" maxlength="15">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Choose a password" minlength="6" maxlength="128" required>
        </div>

        <button type="submit" class="btn">Register</button>

        <p class="link-center">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </form>

</div>
{% endblock %}
