{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}
{% block page_class %}center{% endblock %}

{% block content %}
<div class="box box-narrow">

    <h2>FORGOT PASSWORD</h2>
    <p class="hint">Enter your registered email and we will send you an OTP.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" maxlength="50" required>
        </div>

        <button type="submit" class="btn">Send OTP</button>

        <p class="link-center">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </p>

    </form>

</div>
{% endblock %}
