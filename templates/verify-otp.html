{% extends "base.html" %}

{% block title %}Verify OTP{% endblock %}
{% block page_class %}center{% endblock %}

{% block extra_style %}
<style>
    /* Big, spaced-out digits for the OTP box */
    #otp { font-size: 22px; letter-spacing: 8px; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="box box-narrow">

    <h2>ENTER OTP</h2>
    <p class="hint">Enter the 6-digit OTP sent to<br><b>{{ email }}</b></p>

    <form method="POST" action="{{ url_for('verify_otp') }}">

        <div class="form-group">
            <input type="text" id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   placeholder="------" autocomplete="one-time-code" aria-label="6-digit OTP" autofocus required>
        </div>

        <button type="submit" class="btn">Verify OTP</button>

        <p class="link-center">
            Did not get it?
            <a href="{{ url_for('forgot_password') }}">Resend OTP</a>
        </p>

    </form>

</div>
{% endblock %}
