{% extends "base.html" %}

{% block title %}New Password{% endblock %}
{% block page_class %}center{% endblock %}

{% block content %}
<div class="box box-narrow">

    <h2>NEW PASSWORD</h2>

    <form method="POST" action="{{ url_for('reset_password') }}">

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Enter new password"
                   minlength="6" maxlength="128" required>
        </div>

        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password"
                   minlength="6" maxlength="128" required>
        </div>

        <button type="submit" class="btn">Update Password</button>

    </form>

</div>
{% endblock %}
